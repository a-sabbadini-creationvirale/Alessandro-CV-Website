name: Build for Hostinger

# Builds the Astro site and publishes dist/ to the `hostinger` branch.
# Hostinger (hPanel > Advanced > Git) pulls that branch into public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          commit_message: Deploy ${{ github.sha }}
      - name: Trigger Hostinger pull
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.HOSTINGER_WEBHOOK }}
        run: curl -fsS -X POST "$HOOK"
